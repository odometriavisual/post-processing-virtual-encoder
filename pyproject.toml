[project]
name = "post-processing"
version = "1.0.0"
description = "Post processing toolbox for the Virtual Encoder"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10.7",
  "numpy~=1.26.4",
  "opencv-python>=4.11.0.86",
  "tqdm>=4.67.3",
  "visual-odometer",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
include = [ "post_processing" ]

[tool.uv.sources]
visual-odometer = { git = "https://github.com/odometriavisual/visual-odometer" }

